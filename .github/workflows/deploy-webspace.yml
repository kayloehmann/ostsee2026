name: Deploy zum Webspace (kayloehmann.de)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-webspace
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node.js einrichten
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Astro-Seite bauen
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high

      - name: SSH-Setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync zum Webspace
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          expected=/home/web/ostsee2026/
          if [ "$DEPLOY_PATH" != "$expected" ]; then
            echo "::error::DEPLOY_PATH muss exakt $expected sein."
            exit 1
          fi
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "${{ github.sha }}" <<'BASH'
          set -euo pipefail
          target=/home/web/ostsee2026
          backup_dir="$HOME/.deploy-backups"
          backup="$backup_dir/ostsee2026-pre-$1.tar.gz"
          mkdir -p "$backup_dir" "$target"
          if [ ! -e "$backup" ]; then
            tar -C "$target" -czf "$backup" .
            chmod 600 "$backup"
          fi
          test -s "$backup"
          echo "Pre-Deploy-Backup: $backup"
          BASH
          rsync -avz --delete \
            --rsh "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: Eltern-.htaccess für Subdomain-Mapping
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # ISPConfig: ostsee2026.kayloehmann.de ist ServerAlias der Hauptdomain
          # (kein eigener VHost-DocRoot) -- gleiches Muster wie island2026.
          # Wir schreiben mod_rewrite ins Apache-Webroot, damit die Subdomain
          # ohne Pfad-Präfix direkt auf /ostsee2026/ geserved wird. Wichtig:
          # absoluter Pfad, weil ~ = /private (HOME) und NICHT der Apache-Webroot.
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'BASH'
          set -e
          WEBROOT=/home/web
          HT="$WEBROOT/.htaccess"
          BLOCK="$WEBROOT/.htaccess.ostsee2026.new"

          cat > "$BLOCK" <<'RULES'
          # >>> ostsee2026.kayloehmann.de -> /ostsee2026/  (auto-managed by deploy-webspace.yml)
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteCond %{HTTP_HOST} ^ostsee2026\.kayloehmann\.de$ [NC]
              RewriteCond %{REQUEST_URI} !^/ostsee2026/ [NC]
              RewriteRule ^(.*)$ /ostsee2026/$1 [L]
          </IfModule>
          # <<< ostsee2026.kayloehmann.de
          RULES

          touch "$HT"
          if grep -q ">>> ostsee2026.kayloehmann.de" "$HT"; then
            sed -i '/>>> ostsee2026.kayloehmann.de/,/<<< ostsee2026.kayloehmann.de/d' "$HT"
          fi
          cat "$BLOCK" >> "$HT"
          rm -f "$BLOCK"
          echo "=== $HT (final) ==="
          cat "$HT"
          BASH

      - name: Smoke-Test der Live-URL
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -euo pipefail
          sleep 2
          de_body=$(mktemp)
          en_body=$(mktemp)
          trap 'rm -f "$de_body" "$en_body"' EXIT
          curl --fail --silent --show-error "$DEPLOY_URL/de/" -o "$de_body"
          curl --fail --silent --show-error "$DEPLOY_URL/en/" -o "$en_body"
          grep -Fq '<title>Ostsee 2026 — Timmendorfer Strand</title>' "$de_body"
          grep -Fq '<title>Baltic Sea 2026 — Timmendorfer Strand</title>' "$en_body"
          grep -Fq 'Störtebeker Festspiele' "$de_body"
          curl --fail --silent --show-error "$DEPLOY_URL/images/timmendorfer-strand.jpg" -o /dev/null
          echo "Bilinguale Ostsee-Seite, Karte und Reiseziele sind live."
